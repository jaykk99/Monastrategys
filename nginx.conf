# SPA serving: every non-asset route falls back to /index.html.
# $PORT is substituted at container start (see Dockerfile CMD).
server {
  listen ${PORT:-80};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed Vite assets; index.html is never cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff;
}
